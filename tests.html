<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8">
    <title> Regex Tests - Book & Notes Vault</title>
    <style>
      body { font-family: sans-serif; padding:24px; background: #0f172a; color: #f8fafc;}
      h1 { color: #818cf8; margin-bottom: 20px; }
      .pass { color: #4ade80; font-weight: bold; }
      .fail { color: #f87171; font-weight: bold; }
      li { margin-bottom: 10px; font-size: 0.95rem; }
      ul { list-style: none; padding: 0;}
      </style>
      </head>
      <body>
        <h1> Book & Vault - Regex Test</h1>
        <ul id="results"></ul>
        <script>
          const results = document.getElementById('results');

          function assert(name, condition) {
            const li = document.createElement('li');
            li.innerHTML = name + ':' + (condition
              ? "<span class='pass'>PASS</span>"
              : "<span class='fail'>FAIL</span>");
              results.appendChild(li);
          }

          // Rule 1: Titles no leading or trailing spaces
          const titleRegex = /^[A-Za-z0-9]+(?:[ -][A-Za-z0-9]+)*$/;
          assert("Title valid - The Midnight Library", titleRegex.test("The Midnight Library"));
          assert("Title invalid - leading space", !titleRegex.test("The Midnight Library "));
          assert("Title invalid - trailing space", !titleRegex.test("The Midnight Library"));
           
          // Rule 2: Pages must be positive integer
          const pagesRegex = /^[1-9]\d*$/;
          assert("Pages valid - 288", pagesRegex.test("288"));
          assert("Pages valid - 1104", pagesRegex.test("1104"));
          assert("Pages invalid -zero", !pagesRegex.test("0"));
          assert("Pages invalid - negative", !pagesRegex.test("-50"));

          // Rule 3: Date format YYYY-MM-DD
          const dateRegex = /^\{4}-(0[1-9]|1[0-2])-(0[1-9]|[12]\d|3[01])$/;
          assert("Date valid - 2026-10-08", dateRegex.test("2026-10-08"));
          assert("Date valid - 2026-07-22", dateRegex.test("2026-07-22"));
          assert("Date invalid - wrong format", !dateRegex.test("08-10-2026"));
          assert("Date invalid - bad month 13", !dateRegex.test("2026-13-01"));

          // Rule 4: Advanced - duplicate word detector
          const dupRegex = /\b(\w+)\s+\1\b/i;
          assert("Duplicate detected - Library Library", dupRegex.test("Library Library"));
          assert("No duplicate - The Midnight Library", !dupRegex.test("The Midnight Library"));
          assert("No duplicate - Hurricane Summer", !dupRegex.test("Hurrican Summer"));
        </script>
      </body>
</html>
